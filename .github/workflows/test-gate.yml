name: Test Gate

on:
  push:
    branches: [ python ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: vendor
      UV_PROJECT_ENVIRONMENT: ${{ github.workspace }}/.venv
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify bundled i2pd binaries against committed checksums
        run: scripts/verify_bundled_i2pd.sh

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.6.14"

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install project + dev tools (locked)
        run: uv sync --frozen

      # QtGui needs EGL; QtMultimedia (call overlay) needs Pulse.
      - name: Install Qt offscreen runtime libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglib2.0-0 libpulse0 libasound2t64 \
            libxkbcommon0 libdbus-1-3 libfontconfig1 \
            || sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-glx libegl1-mesa libglib2.0-0 libpulse0 libasound2 \
            libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Run security regression test gate
        run: |
          uv run python -m unittest \
            tests.test_blindbox_state_wrap \
            tests.test_asyncio_regression \
            tests.test_blindbox_client \
            tests.test_atomic_writes \
            tests.test_chat_history \
            tests.test_history_ui_guards \
            tests.test_profile_import_overwrite \
            tests.test_protocol_framing_vnext \
            tests.test_sam_input_validation \
            tests.test_audit_remediation

      - name: Pytest suite
        run: |
          # Importing PyQt in this process corrupts later GC (segfault 139)
          # in unrelated tests. Qt, TUI, and the rest each get their own interpreter.
          uv run pytest tests/ -q --tb=short \
            --ignore-glob='tests/test_tui*.py' \
            --ignore-glob='tests/test_gui*.py' \
            --ignore=tests/test_compose_shortcuts.py \
            --ignore=tests/test_popup_geometry_profile_combo.py \
            --ignore=tests/test_call_quality.py
          uv run pytest \
            tests/test_gui_*.py \
            tests/test_compose_shortcuts.py \
            tests/test_popup_geometry_profile_combo.py \
            tests/test_call_quality.py \
            -q --tb=short
          uv run pytest tests/test_tui_*.py -q --tb=short
