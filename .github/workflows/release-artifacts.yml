# Python desktop zips (PyInstaller) plus Android APKs on GitHub-hosted runners.
# Linux stays on Ubuntu 22.04 so the glibc baseline matches historical PyQt6 releases.
# Jobs upload into a draft. publish-release marks it public only after
# verify-desktop-assets sees the full zip set, which starts "Release Linux packages".
name: Release artifacts

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version (v1.5.2, 1.5.2, or typo v.1.5.2) — upload targets Git tag vX.Y.Z"
        required: true
        type: string
      source_ref:
        description: "Ref to build from: python, v1.5.2, or empty (= same as tag)."
        required: false
        type: string
        default: ""
      upload:
        description: "Upload assets to the GitHub Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen
  I2PCHAT_SKIP_GPG_SIGN: "1"
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            sums: SHA256SUMS.linux-x86_64
            also_plain_sums: true
          - os: ubuntu-22.04-arm
            arch: aarch64
            sums: SHA256SUMS.linux-aarch64
            also_plain_sums: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolve tag and checkout ref
        id: meta
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SOURCE_REF: ${{ github.event.inputs.source_ref || '' }}
          EVENT_NAME: ${{ github.event_name }}
          UPLOAD_INPUT: ${{ github.event.inputs.upload }}
        run: |
          trim() { echo "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          to_ver() {
            local x
            x="$(trim "$1")"
            x="${x#v}"
            x="${x#.}"
            echo "$x"
          }
          R="$(to_ver "$TAG")"
          if [ -z "$R" ]; then echo "ERROR: empty tag" >&2; exit 1; fi
          if ! echo "$R" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag must be semver X.Y.Z, got: $TAG" >&2
            exit 1
          fi
          echo "tag=v${R}" >> "$GITHUB_OUTPUT"
          echo "ver=${R}" >> "$GITHUB_OUTPUT"
          SRC_RAW="$(trim "$SOURCE_REF")"
          if [ -z "$SRC_RAW" ]; then SRC="v${R}"
          else
            TMP="$(to_ver "$SRC_RAW")"
            if echo "$TMP" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then SRC="v${TMP}"; else SRC="$SRC_RAW"; fi
          fi
          echo "checkout_ref=${SRC}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$UPLOAD_INPUT" = "false" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ steps.meta.outputs.checkout_ref }}

      - name: Use python packaging when the tag tree has no TUI spec
        run: |
          VER="${{ steps.meta.outputs.ver }}"
          if [ -f I2PChat-tui.spec ] && [ -f build-linux.sh ]; then
            exit 0
          fi
          echo "Python packaging missing — fetching origin/python"
          git fetch --depth=1 origin python
          git checkout -f FETCH_HEAD
          FILE_VER="$(tr -d '\r\n' < VERSION)"
          if [ "$FILE_VER" != "$VER" ]; then
            echo "ERROR: origin/python VERSION is '$FILE_VER' but release is '$VER'." >&2
            exit 1
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            wget desktop-file-utils file patchelf \
            libfuse2 \
            libgl1-mesa-glx libegl1-mesa \
            libxkbcommon-x11-0 libdbus-1-3 \
            libglib2.0-0 libfontconfig1 libfreetype6 libdrm2 \
            libxcb1 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-render0 \
            libxcb-shm0 libxcb-randr0 libxcb-keysyms1 libxcb-image0 libxcb-icccm4 \
            libxcb-util1 libxcb-sync1 libxcb-xinput0 libxcb-cursor0

      - name: Verify bundled i2pd against committed checksums
        run: scripts/verify_bundled_i2pd.sh --desktop-only

      - name: Build Linux zips (PyInstaller + AppImage)
        run: ./build-linux.sh

      - name: Smoke-test TUI zip on Ubuntu 22.04
        run: |
          VER="${{ steps.meta.outputs.ver }}"
          export ZIP="I2PChat-linux-${{ matrix.arch }}-tui-v${VER}.zip"
          docker run --rm -v "$PWD:/ws:ro" -e "ZIP=$ZIP" ubuntu:22.04 bash -ceu "
            apt-get update -qq
            apt-get install -y -qq unzip ca-certificates
            mkdir -p /tmp/tui
            unzip -q -d /tmp/tui /ws/\$ZIP
            cd /tmp/tui
            set +e
            out=\$(timeout 15 ./i2pchat-tui 2>&1) || true
            if echo \"\$out\" | grep -qi 'GLIBC_.*not found'; then
              echo \"\$out\" | head -40
              echo \"ERROR: TUI needs a newer glibc than Ubuntu 22.04\" >&2
              exit 1
            fi
            echo \"TUI smoke OK\"
          "

      - name: Verify VERSION matches tag
        run: |
          VER="${{ steps.meta.outputs.ver }}"
          FILE_VER="$(tr -d '\r\n' < VERSION)"
          if [ "$FILE_VER" != "$VER" ]; then
            echo "ERROR: VERSION file is '$FILE_VER' but tag implies '$VER'" >&2
            exit 1
          fi

      - name: Stage Linux assets
        run: |
          VER="${{ steps.meta.outputs.ver }}"
          ARCH="${{ matrix.arch }}"
          SUMS="${{ matrix.sums }}"
          ZIP_GUI="I2PChat-linux-${ARCH}-v${VER}.zip"
          ZIP_TUI="I2PChat-linux-${ARCH}-tui-v${VER}.zip"
          for f in "$ZIP_GUI" "$ZIP_TUI" SHA256SUMS; do
            if [ ! -f "$f" ]; then
              echo "ERROR: missing $f" >&2
              ls -la >&2 || true
              exit 1
            fi
          done
          cp SHA256SUMS "$SUMS"
          mkdir -p dist-upload
          cp "$ZIP_GUI" "$ZIP_TUI" "$SUMS" dist-upload/
          if [ "${{ matrix.also_plain_sums }}" = "true" ]; then
            cp SHA256SUMS dist-upload/SHA256SUMS
          fi

      - name: Upload Linux workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.arch }}
          path: dist-upload/*
          if-no-files-found: error

      - name: Ensure GitHub Release exists
        if: ${{ steps.meta.outputs.upload == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "I2PChat ${TAG}" \
            --notes "Python desktop ${TAG}. Android APKs from the same workflow. Draft until asset verification." \
            --draft

      - name: Upload Linux assets to release
        if: ${{ steps.meta.outputs.upload == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" dist-upload/* \
            --repo "${{ github.repository }}" --clobber

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            sums: SHA256SUMS.macos-arm64
          - arch: x64
            sums: SHA256SUMS.macos-x64
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - name: Resolve tag and checkout ref
        id: meta
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SOURCE_REF: ${{ github.event.inputs.source_ref || '' }}
          EVENT_NAME: ${{ github.event_name }}
          UPLOAD_INPUT: ${{ github.event.inputs.upload }}
        run: |
          trim() { echo "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          to_ver() {
            local x
            x="$(trim "$1")"
            x="${x#v}"
            x="${x#.}"
            echo "$x"
          }
          R="$(to_ver "$TAG")"
          if [ -z "$R" ]; then echo "ERROR: empty tag" >&2; exit 1; fi
          if ! echo "$R" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag must be semver X.Y.Z, got: $TAG" >&2
            exit 1
          fi
          echo "tag=v${R}" >> "$GITHUB_OUTPUT"
          echo "ver=${R}" >> "$GITHUB_OUTPUT"
          SRC_RAW="$(trim "$SOURCE_REF")"
          if [ -z "$SRC_RAW" ]; then SRC="v${R}"
          else
            TMP="$(to_ver "$SRC_RAW")"
            if echo "$TMP" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then SRC="v${TMP}"; else SRC="$SRC_RAW"; fi
          fi
          echo "checkout_ref=${SRC}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$UPLOAD_INPUT" = "false" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ steps.meta.outputs.checkout_ref }}

      - name: Use python packaging when the tag tree has no TUI spec
        run: |
          VER="${{ steps.meta.outputs.ver }}"
          if [ -f I2PChat-tui.spec ] && [ -f build-macos.sh ]; then
            exit 0
          fi
          git fetch --depth=1 origin python
          git checkout -f FETCH_HEAD
          FILE_VER="$(tr -d '\r\n' < VERSION)"
          if [ "$FILE_VER" != "$VER" ]; then
            echo "ERROR: origin/python VERSION is '$FILE_VER' but release is '$VER'." >&2
            exit 1
          fi

      - name: Install uv
        env:
          # Same uv release as test-gate.yml. Both architectures take the
          # pinned GitHub release tarball with its checksum verified against
          # a value committed here (not just the .sha256 published next to
          # the tarball): the build toolchain must not be whatever "latest"
          # Homebrew or astral.sh happens to serve when the job runs.
          UV_VERSION: "0.6.14"
          UV_SHA256_X64: "1d8ecb2eb3b68fb50e4249dc96ac9d2458dc24068848f04f4c5b42af2fd26552"
          UV_SHA256_ARM64: "4ea4731010fbd1bc8e790e07f199f55a5c7c2c732e9b77f85e302b0bee61b756"
        run: |
          set -euo pipefail
          if [ "${{ matrix.arch }}" = "x64" ]; then
            # macos-latest is arm64. Intel zips are built under Rosetta with an x86_64 uv/CPython.
            TRIPLE="x86_64-apple-darwin"
            EXPECTED="$UV_SHA256_X64"
            DEST="$HOME/.local/uv-x64"
          else
            TRIPLE="aarch64-apple-darwin"
            EXPECTED="$UV_SHA256_ARM64"
            DEST="$HOME/.local/uv-arm64"
          fi
          curl -fsSL -o /tmp/uv.tar.gz \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-${TRIPLE}.tar.gz"
          ACTUAL="$(shasum -a 256 /tmp/uv.tar.gz | cut -d' ' -f1)"
          if [ -z "$EXPECTED" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: uv tarball checksum mismatch (expected $EXPECTED, got $ACTUAL)" >&2
            exit 1
          fi
          mkdir -p "$DEST"
          tar -xzf /tmp/uv.tar.gz -C "$DEST" --strip-components=1
          if [ "${{ matrix.arch }}" = "x64" ]; then
            arch -x86_64 "$DEST/uv" python install 3.14
          else
            echo "$DEST" >> "$GITHUB_PATH"
            "$DEST/uv" python install 3.14
          fi

      - name: Verify bundled i2pd against committed checksums
        run: scripts/verify_bundled_i2pd.sh --desktop-only

      - name: Build macOS zips
        run: |
          if [ "${{ matrix.arch }}" = "x64" ]; then
            export PATH="$HOME/.local/uv-x64:$PATH"
            export I2PCHAT_PYTHON="$(arch -x86_64 uv python find 3.14)"
            arch -x86_64 ./build-macos.sh
          else
            ./build-macos.sh
          fi

      - name: Verify VERSION matches tag
        run: |
          VER="${{ steps.meta.outputs.ver }}"
          FILE_VER="$(tr -d '\r\n' < VERSION)"
          if [ "$FILE_VER" != "$VER" ]; then
            echo "ERROR: VERSION file is '$FILE_VER' but tag implies '$VER'" >&2
            exit 1
          fi

      - name: Stage macOS assets
        run: |
          VER="${{ steps.meta.outputs.ver }}"
          ARCH="${{ matrix.arch }}"
          SUMS="${{ matrix.sums }}"
          ZIP_GUI="I2PChat-macOS-${ARCH}-v${VER}.zip"
          ZIP_TUI="I2PChat-macOS-${ARCH}-tui-v${VER}.zip"
          for f in "$ZIP_GUI" "$ZIP_TUI" SHA256SUMS; do
            if [ ! -f "$f" ]; then
              echo "ERROR: missing $f" >&2
              ls -la >&2 || true
              exit 1
            fi
          done
          cp SHA256SUMS "$SUMS"
          mkdir -p dist-upload
          cp "$ZIP_GUI" "$ZIP_TUI" "$SUMS" dist-upload/

      - name: Upload macOS workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}
          path: dist-upload/*
          if-no-files-found: error

      - name: Ensure GitHub Release exists
        if: ${{ steps.meta.outputs.upload == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "I2PChat ${TAG}" \
            --notes "Python desktop ${TAG}. Android APKs from the same workflow. Draft until asset verification." \
            --draft

      - name: Upload macOS assets to release
        if: ${{ steps.meta.outputs.upload == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" dist-upload/* \
            --repo "${{ github.repository }}" --clobber

  windows:
    runs-on: windows-latest
    steps:
      - name: Resolve tag and checkout ref
        id: meta
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SOURCE_REF: ${{ github.event.inputs.source_ref || '' }}
          EVENT_NAME: ${{ github.event_name }}
          UPLOAD_INPUT: ${{ github.event.inputs.upload }}
        shell: bash
        run: |
          trim() { echo "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          to_ver() {
            local x
            x="$(trim "$1")"
            x="${x#v}"
            x="${x#.}"
            echo "$x"
          }
          R="$(to_ver "$TAG")"
          if [ -z "$R" ]; then echo "ERROR: empty tag" >&2; exit 1; fi
          if ! echo "$R" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag must be semver X.Y.Z, got: $TAG" >&2
            exit 1
          fi
          echo "tag=v${R}" >> "$GITHUB_OUTPUT"
          echo "ver=${R}" >> "$GITHUB_OUTPUT"
          SRC_RAW="$(trim "$SOURCE_REF")"
          if [ -z "$SRC_RAW" ]; then SRC="v${R}"
          else
            TMP="$(to_ver "$SRC_RAW")"
            if echo "$TMP" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then SRC="v${TMP}"; else SRC="$SRC_RAW"; fi
          fi
          echo "checkout_ref=${SRC}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$UPLOAD_INPUT" = "false" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ steps.meta.outputs.checkout_ref }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install uv
        shell: pwsh
        env:
          # Same uv release as test-gate.yml; the installer honours this pin.
          UV_VERSION: "0.6.14"
        run: irm "https://astral.sh/uv/$env:UV_VERSION/install.ps1" | iex

      - name: Verify bundled i2pd against committed checksums
        shell: bash
        run: scripts/verify_bundled_i2pd.sh --desktop-only

      - name: Build Windows zips
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;" + $env:Path
          $env:I2PCHAT_SKIP_GPG_SIGN = "1"
          ./build-windows.ps1

      - name: Verify VERSION matches tag
        shell: bash
        run: |
          VER="${{ steps.meta.outputs.ver }}"
          FILE_VER="$(tr -d '\r\n' < VERSION)"
          if [ "$FILE_VER" != "$VER" ]; then
            echo "ERROR: VERSION file is '$FILE_VER' but tag implies '$VER'" >&2
            exit 1
          fi

      - name: Stage Windows assets
        shell: bash
        run: |
          VER="${{ steps.meta.outputs.ver }}"
          mkdir -p dist-upload
          for name in \
            "I2PChat-windows-x64-v${VER}.zip" \
            "I2PChat-windows-tui-x64-v${VER}.zip" \
            "I2PChat-windows-x64-winget-v${VER}.zip" \
            "I2PChat-windows-tui-x64-winget-v${VER}.zip"
          do
            if [ ! -f "dist/${name}" ]; then
              echo "ERROR: missing dist/${name}" >&2
              ls -la dist >&2 || true
              exit 1
            fi
            cp "dist/${name}" dist-upload/
          done
          cp SHA256SUMS dist-upload/SHA256SUMS.windows-x64

      - name: Upload Windows workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          path: dist-upload/*
          if-no-files-found: error

      - name: Ensure GitHub Release exists
        if: ${{ steps.meta.outputs.upload == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "I2PChat ${TAG}" \
            --notes "Python desktop ${TAG}. Android APKs from the same workflow. Draft until asset verification." \
            --draft

      - name: Upload Windows assets to release
        if: ${{ steps.meta.outputs.upload == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" dist-upload/* \
            --repo "${{ github.repository }}" --clobber

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Resolve tag and checkout ref
        id: meta
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          SOURCE_REF: ${{ github.event.inputs.source_ref || '' }}
          EVENT_NAME: ${{ github.event_name }}
          UPLOAD_INPUT: ${{ github.event.inputs.upload }}
        run: |
          trim() { echo "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          to_ver() {
            local x
            x="$(trim "$1")"
            x="${x#v}"
            x="${x#.}"
            echo "$x"
          }
          R="$(to_ver "$TAG")"
          if [ -z "$R" ]; then echo "ERROR: empty tag" >&2; exit 1; fi
          if ! echo "$R" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag must be semver X.Y.Z, got: $TAG" >&2
            exit 1
          fi
          echo "tag=v${R}" >> "$GITHUB_OUTPUT"
          echo "ver=${R}" >> "$GITHUB_OUTPUT"
          SRC_RAW="$(trim "$SOURCE_REF")"
          if [ -z "$SRC_RAW" ]; then SRC="v${R}"
          else
            TMP="$(to_ver "$SRC_RAW")"
            if echo "$TMP" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then SRC="v${TMP}"; else SRC="$SRC_RAW"; fi
          fi
          echo "checkout_ref=${SRC}" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$UPLOAD_INPUT" = "false" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ steps.meta.outputs.checkout_ref }}

      - name: Use python tree when Android packaging is missing
        run: |
          VER="${{ steps.meta.outputs.ver }}"
          if [ -f build-android.sh ] && [ -d android/app ]; then
            exit 0
          fi
          echo "Android packaging missing — fetching origin/python"
          git fetch --depth=1 origin python
          git checkout -f FETCH_HEAD
          FILE_VER="$(tr -d '\r\n' < VERSION)"
          if [ "$FILE_VER" != "$VER" ]; then
            echo "ERROR: origin/python VERSION is '$FILE_VER' but release is '$VER'." >&2
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install Android SDK packages + NDK r28
        env:
          NDK_VERSION: "28.2.13676358"
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Verify bundled libi2pd.so against committed checksums
        run: scripts/verify_bundled_i2pd.sh --android-only

      # Real upload keystore from repository secrets when provisioned. Without
      # it the APKs are signed with the public debug key and are sideload-only
      # (see docs/AUDIT_1.5.2_EN.md). The keystore is written to the runner's
      # temp dir and removed at the end of the job.
      - name: Configure Android release signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            KS="${RUNNER_TEMP}/upload.keystore"
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
            chmod 600 "$KS"
            keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            echo "keystore=$KS" >> "$GITHUB_OUTPUT"
            echo "allow_debug=" >> "$GITHUB_OUTPUT"
            echo "mode=upload-keystore" >> "$GITHUB_OUTPUT"
            echo "Release APKs will be signed with the upload keystore."
          else
            echo "::warning::ANDROID_UPLOAD_KEYSTORE_* secrets are not set; APKs will be signed with the public debug key (sideload-only)."
            mkdir -p "$HOME/.android"
            DKS="$HOME/.android/debug.keystore"
            if [ ! -f "$DKS" ]; then
              keytool -genkeypair -v \
                -keystore "$DKS" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "keystore=" >> "$GITHUB_OUTPUT"
            echo "allow_debug=1" >> "$GITHUB_OUTPUT"
            echo "mode=debug-key" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Android release APK
        env:
          I2PCHAT_ANDROID_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          I2PCHAT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          I2PCHAT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          I2PCHAT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          I2PCHAT_ANDROID_ALLOW_DEBUG_SIGNING: ${{ steps.signing.outputs.allow_debug }}
        run: ./build-android.sh --release

      - name: Build Android arm32 sideload APK
        env:
          I2PCHAT_ANDROID_KEYSTORE: ${{ steps.signing.outputs.keystore }}
          I2PCHAT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          I2PCHAT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          I2PCHAT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          I2PCHAT_ANDROID_ALLOW_DEBUG_SIGNING: ${{ steps.signing.outputs.allow_debug }}
        run: ./build-android.sh --arm32 --release

      - name: Remove upload keystore from the runner
        if: ${{ always() && steps.signing.outputs.mode == 'upload-keystore' }}
        run: rm -f "${RUNNER_TEMP}/upload.keystore"

      - name: Verify VERSION matches tag
        run: |
          VER="${{ steps.meta.outputs.ver }}"
          FILE_VER="$(tr -d '\r\n' < VERSION)"
          if [ "$FILE_VER" != "$VER" ]; then
            echo "ERROR: VERSION file is '$FILE_VER' but tag implies '$VER'" >&2
            exit 1
          fi

      - name: Stage Android assets
        run: |
          VER="${{ steps.meta.outputs.ver }}"
          SRC="dist/I2PChat-android-v${VER}-release.apk"
          ARM32="dist/I2PChat-android-v${VER}-arm32-release.apk"
          for f in "$SRC" "$ARM32"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: missing $f" >&2
              ls -la dist >&2 || true
              exit 1
            fi
          done
          mkdir -p dist-upload
          cp "$SRC" "dist-upload/I2PChat-android-v${VER}.apk"
          cp "$ARM32" "dist-upload/I2PChat-android-v${VER}-arm32-release.apk"
          sha256sum \
            "dist-upload/I2PChat-android-v${VER}.apk" \
            "dist-upload/I2PChat-android-v${VER}-arm32-release.apk" \
            | awk '{print $1"  "$2}' | sed "s|dist-upload/||" > dist-upload/SHA256SUMS.android

      - name: Upload Android workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android
          path: dist-upload/*
          if-no-files-found: error

      - name: Ensure GitHub Release exists
        if: ${{ steps.meta.outputs.upload == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "I2PChat ${TAG}" \
            --notes "Python desktop ${TAG}. Android APKs from the same workflow. Draft until asset verification." \
            --draft

      - name: Upload Android assets to release
        if: ${{ steps.meta.outputs.upload == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.meta.outputs.tag }}" dist-upload/* \
            --repo "${{ github.repository }}" --clobber

  verify-desktop-assets:
    needs: [linux, macos, windows, android]
    if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || github.event.inputs.upload != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/verify_github_release_assets.sh
          sparse-checkout-cone-mode: false

      - name: Verify GitHub Release desktop and Android assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          I2PCHAT_GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! echo "$TAG" | grep -qE '^v?\.?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag must be semver vX.Y.Z, got: $TAG" >&2
            exit 1
          fi
          bash scripts/verify_github_release_assets.sh --skip-deb --skip-gpg "${TAG}"

  # Produce one combined SHA256SUMS covering every platform and sign it with
  # the release key when the maintainer has provisioned one. Per-platform
  # build jobs deliberately do not sign: the key would have to be present on
  # five different runners, and the signature would cover one platform only.
  sign-checksums:
    needs: [verify-desktop-assets]
    if: ${{ success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.upload != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/sign_release_checksums.sh
            scripts/verify_github_release_assets.sh
          sparse-checkout-cone-mode: false

      - name: Combine per-platform checksums and sign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          I2PCHAT_GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          if ! echo "$TAG" | grep -qE '^v?\.?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag must be semver vX.Y.Z, got: $TAG" >&2
            exit 1
          fi
          bash scripts/sign_release_checksums.sh "${TAG}"

      - name: Verify the signed checksum set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          I2PCHAT_GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          HAVE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAVE_KEY" = "true" ]; then
            bash scripts/verify_github_release_assets.sh --skip-deb "${TAG}"
          else
            echo "::warning::RELEASE_GPG_PRIVATE_KEY is not set; the release is published without SHA256SUMS.asc"
            bash scripts/verify_github_release_assets.sh --skip-deb --skip-gpg "${TAG}"
          fi

  publish-release:
    needs: [sign-checksums]
    if: ${{ success() && (github.event_name != 'workflow_dispatch' || github.event.inputs.upload != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          trim() { echo "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'; }
          raw="$(trim "$INPUT_TAG")"
          raw="${raw#v}"
          raw="${raw#.}"
          if ! echo "$raw" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag must be semver X.Y.Z, got: $raw" >&2
            exit 1
          fi
          TAG="v${raw}"
          NOTES="docs/releases/RELEASE_${raw}.md"
          args=(release edit "$TAG" --repo "${{ github.repository }}" --draft=false)
          if [ -f "$NOTES" ]; then
            args+=(--notes-file "$NOTES")
          fi
          gh "${args[@]}"
          echo "Published ${TAG}"
