# Local overrides; CI runs: gitleaks detect --source . --redact
# Gitleaks auto-discovers this file in the repo root.

title = "I2PChat"

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and golden vectors (synthetic keys, not production secrets)"
paths = [
  '''tests/test_clear_locked_peer\.py''',
  '''tests/test_profile_dat\.py''',
  '''cpp/testdata/vectors/.*''',
  '''cpp/tests/test_storage_profile_dat\.cpp''',
  '''cpp/tests/test_blindbox_replica_client\.cpp''',
]
